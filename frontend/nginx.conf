# AI PPT 前端 nginx 配置：静态资源 + SPA fallback + API 反代 + SSE 特殊处理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（带 hash 的构建产物可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE 进度流：关闭缓冲，保持长连接（必须放在 /api 之前精确匹配）
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # API 反向代理
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 120m;   # 支持大文件上传（文档 ≤100MB）
        proxy_read_timeout 300s;
    }

    # 健康检查在 /api/v1 之外，需要独立 location 代理到后端
    location /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback：其余路径全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
